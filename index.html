<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071b19"><title>Ghost Ninja World</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b19;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}#hud{position:absolute;top:env(safe-area-inset-top,12px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}#hud h1{font-size:18px;margin:8px 0 2px;text-shadow:0 2px 8px #000}#hud small{font-size:11px;color:#b9fbd3}#badge{background:#123d32c9;border:1px solid #70ffa388;border-radius:18px;padding:8px 12px;font-size:12px}#joy{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:26px;width:136px;height:136px;border:2px solid #d0ffdb6b;background:#0a442d77;border-radius:50%;touch-action:none;user-select:none}#stick{position:absolute;left:43px;top:43px;width:46px;height:46px;border-radius:50%;background:#84ffacb9;border:2px solid white;box-shadow:0 0 20px #5cff99}#actions{position:absolute;right:24px;bottom:calc(43px + env(safe-area-inset-bottom));display:flex;gap:13px;align-items:end}button{border:1px solid #d1ffe9aa;color:white;background:#12633eaa;border-radius:50%;width:73px;height:73px;font-weight:800;font-size:13px;box-shadow:0 0 20px #2bff8555;touch-action:none}#fly{width:60px;height:60px;background:#224e71ba}#tip{position:absolute;bottom:calc(183px + env(safe-area-inset-bottom));left:16px;right:16px;text-align:center;font-size:12px;color:#dbffea;text-shadow:0 2px 8px black;pointer-events:none}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#081d1b;z-index:10;font-size:16px}#error{display:none;position:absolute;inset:20px;z-index:20;background:#152a27;padding:22px;border-radius:14px} @media (min-width:800px){#joy{width:150px;height:150px}#stick{left:50px;top:50px}}
</style></head><body><div id="loading">Building your ghost world…</div><div id="error">Unable to load the 3D engine. Please check your internet connection and reopen the page.</div><div id="hud"><div><h1>👻 GHOST NINJA WORLD</h1><small>Explore the glowing village • Version 1</small></div><div id="badge">✦ Ghost Mode</div></div><div id="tip">Left joystick: move · Drag right side: look around · Jump or float</div><div id="joy"><div id="stick"></div></div><div id="actions"><button id="fly">FLOAT</button><button id="jump">JUMP</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x102c34);scene.fog=new THREE.FogExp2(0x102c34,.018);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb2faff,0x324a34,2));const sun=new THREE.DirectionalLight(0xffe3aa,2.2);sun.position.set(-14,26,18);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;scene.add(sun);
const mat=(color,opts={})=>new THREE.MeshStandardMaterial({color,roughness:.4,metalness:.05,...opts});const green=mat(0x45ff79,{transparent:true,opacity:.56,emissive:0x12c842,emissiveIntensity:.55,depthWrite:false,side:THREE.DoubleSide});const lime=mat(0x73ff92,{transparent:true,opacity:.72,emissive:0x29d54b,emissiveIntensity:.5,depthWrite:false});const yellow=mat(0xf6c72d);const dark=mat(0x13292a);const hairMat=mat(0x101719,{roughness:.23});const eyeMat=new THREE.MeshBasicMaterial({color:0xbaff61});
function box(parent,w,h,d,m,x=0,y=0,z=0){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function cyl(parent,rt,rb,h,m,x=0,y=0,z=0,seg=16){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}function ball(parent,r,m,x=0,y=0,z=0){let o=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),m);o.position.set(x,y,z);parent.add(o);return o}
const ground=box(scene,170,.7,170,mat(0x385f48),0,-.5,0);ground.receiveShadow=true;const path=mat(0x9ca18a);for(let i=-13;i<=13;i++)box(scene,3.8,.08,3.8,path,0,-.09,i*3.8);for(let i=-8;i<=8;i++)box(scene,3.8,.08,3.8,path,i*3.8,-.08,16);
const character=new THREE.Group();scene.add(character);const torso=new THREE.Group();character.add(torso);box(torso,1.22,1.22,.73,yellow,0,2.35,0);box(torso,1.23,.12,.75,mat(0xffdb51),0,2.94,0);box(torso,.4,.17,.06,mat(0xe9ae24),0,2.76,-.39);for(let i=0;i<3;i++)ball(torso,.035,mat(0x69490c),0,2.62-i*.16,-.399);
// The character faces negative Z. All limbs have independent pivots for walking animation.
const head=new THREE.Group();head.position.y=3.31;torso.add(head);cyl(head,.54,.54,.74,green,0,0,0,24);ball(head,.09,eyeMat,-.2,.04,-.52);ball(head,.09,eyeMat,.2,.04,-.52);box(head,.33,.055,.025,dark,0,-.2,-.53);for(let i=0;i<17;i++){const a=i*2.39996;ball(head,.25+(.04*(i%3)),hairMat,Math.cos(a)*.46,.39+Math.sin(i*2.1)*.1,Math.sin(a)*.4)}
const arms=[];for(const side of [-1,1]){let pivot=new THREE.Group();pivot.position.set(side*.82,2.82,0);torso.add(pivot);cyl(pivot,.25,.25,.85,green,0,-.4,0);ball(pivot,.22,lime,0,-.91,0);arms.push(pivot)}
const legs=[];for(const side of [-1,1]){let pivot=new THREE.Group();pivot.position.set(side*.33,1.72,0);character.add(pivot);box(pivot,.57,1.15,.64,green,0,-.58,0);box(pivot,.59,.31,.8,lime,0,-1.24,-.09);legs.push(pivot)}box(character,1.18,.29,.68,lime,0,1.62,0);
const aura=new THREE.PointLight(0x49ff6b,3,9);aura.position.y=2.1;character.add(aura);
function tree(x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);cyl(g,.19,.28,2,mat(0x75583b),0,1,0);for(let j=0;j<3;j++)cyl(g,0,1.25-j*.18,1.7,mat(j%2?0x20834d:0x176b46),0,2.1+j*.7,0,7)}for(let i=0;i<55;i++){let x=(Math.sin(i*16.7)*.5+.5)*112-56,z=(Math.cos(i*8.13)*.5+.5)*112-56;if(Math.abs(x)<7||Math.abs(z-16)<6)continue;tree(x,z)}
function house(x,z,color){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(g,5,4.2,4.5,mat(color),0,2.1,0);const roof=box(g,5.9,.7,5.4,mat(0x283a3d),0,4.6,0);roof.rotation.z=.07;box(g,1.2,2.25,.1,dark,0,1.1,-2.3);for(let side of [-1,1]){box(g,.95,1,.11,mat(0xb9fff2,{emissive:0x1a7665,emissiveIntensity:.6}),side*1.45,2.7,-2.31)}for(let xx=-2;xx<=2;xx+=2)for(let zz=-1.5;zz<=1.5;zz+=3)cyl(g,.3,.3,.18,mat(0x596d62),xx,5.02,zz)}house(-11,-8,0x96734f);house(12,-8,0x587a88);house(-11,14,0x9e6e62);house(13,16,0x79815c);
function lantern(x,z){let p=new THREE.Group();p.position.set(x,0,z);scene.add(p);cyl(p,.11,.15,3,mat(0x282f35),0,1.5,0);box(p,.72,.65,.72,mat(0x80ffc4,{emissive:0x22bb88,emissiveIntensity:1.8}),0,3.15,0);let l=new THREE.PointLight(0x62ffae,1.5,8);l.position.y=3.15;p.add(l)}for(let z=-19;z<=26;z+=9){lantern(-3.4,z);lantern(3.4,z)}
const portal=new THREE.Group();portal.position.set(0,0,-25);scene.add(portal);for(let x of [-2.5,2.5])box(portal,.8,6,.8,mat(0x344e50),x,3,0);box(portal,6.1,.8,.8,mat(0x344e50),0,6,0);const portalGlow=new THREE.Mesh(new THREE.TorusGeometry(2.2,.19,12,40),new THREE.MeshBasicMaterial({color:0x52ff99}));portalGlow.position.y=3.3;portal.add(portalGlow);
let joy={x:0,y:0},jump=false,floatMode=false,vy=0,grounded=true,theta=0,phi=.27,camDist=8,drag=null;const joyEl=document.getElementById('joy'),stick=document.getElementById('stick');function moveStick(e){const r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.max(1,Math.hypot(dx,dy)),max=48;joy.x=dx/Math.max(len,max);joy.y=dy/Math.max(len,max);const d=Math.min(max,len);stick.style.transform=`translate(${dx/len*d}px,${dy/len*d}px)`}joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);moveStick(e)});joyEl.addEventListener('pointermove',e=>{if(joyEl.hasPointerCapture(e.pointerId))moveStick(e)});function resetJoy(){joy.x=joy.y=0;stick.style.transform='translate(0,0)'}joyEl.addEventListener('pointerup',resetJoy);joyEl.addEventListener('pointercancel',resetJoy);
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(grounded||floatMode){vy=floatMode?4.5:7.2;grounded=false}});document.getElementById('fly').addEventListener('click',()=>{floatMode=!floatMode;document.getElementById('fly').textContent=floatMode?'LAND':'FLOAT';document.getElementById('badge').textContent=floatMode?'✦ Floating':'✦ Ghost Mode'});
renderer.domElement.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;theta-=(e.clientX-drag.x)*.006;phi=THREE.MathUtils.clamp(phi+(e.clientY-drag.y)*.004,-.25,.85);drag.x=e.clientX;drag.y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('pointercancel',()=>drag=null);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'&&grounded){vy=7.2;grounded=false}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const clock=new THREE.Clock();let t=0;function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);t+=dt;let mx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=-joy.y+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);let magnitude=Math.min(1,Math.hypot(mx,my));if(magnitude){mx/=Math.hypot(mx,my);my/=Math.hypot(mx,my);let forward=new THREE.Vector3(-Math.sin(theta),0,-Math.cos(theta)),right=new THREE.Vector3(Math.cos(theta),0,-Math.sin(theta));let direction=forward.multiplyScalar(my).add(right.multiplyScalar(mx));character.position.addScaledVector(direction,dt*(floatMode?5.5:4.2)*magnitude);character.rotation.y=Math.atan2(-direction.x,-direction.z);character.position.x=THREE.MathUtils.clamp(character.position.x,-78,78);character.position.z=THREE.MathUtils.clamp(character.position.z,-78,78)}
vy-= (floatMode?6:18)*dt;character.position.y+=vy*dt;if(character.position.y<=0){character.position.y=0;vy=0;grounded=true}if(floatMode&&character.position.y<.7){character.position.y=.7;vy=0;grounded=true}if(!floatMode&&character.position.y>.01)grounded=false;
const walk=Math.sin(t*11)*.6*magnitude;legs[0].rotation.x=walk;legs[1].rotation.x=-walk;arms[0].rotation.x=-walk*.7;arms[1].rotation.x=walk*.7;torso.rotation.z=Math.sin(t*2.2)*.018;head.rotation.y=Math.sin(t*1.3)*.045;portalGlow.rotation.z+=dt*.3;
const target=new THREE.Vector3(character.position.x,character.position.y+2.2,character.position.z);const desired=new THREE.Vector3(target.x+Math.sin(theta)*camDist*Math.cos(phi),target.y+Math.sin(phi)*camDist+1,target.z+Math.cos(theta)*camDist*Math.cos(phi));camera.position.lerp(desired,Math.min(1,dt*7));camera.lookAt(target);renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.getElementById('loading').remove();animate();
</script><script>setTimeout(()=>{if(document.getElementById('loading')){document.getElementById('loading').remove();document.getElementById('error').style.display='block'}},12000)</script></body></html>
